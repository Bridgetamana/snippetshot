<!doctype html>
<html>
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src https: data: vscode-webview-resource:; script-src 'nonce-{{nonce}}' vscode-webview-resource:; style-src 'unsafe-inline' https://fonts.googleapis.com vscode-webview-resource:; font-src https://fonts.gstatic.com;"
    />
    <link href="{{stylesUri}}" rel="stylesheet" />
  </head>
  <body>
    <div id="workspace">
      <div id="snippet-container" class="snippet-container">
        <div class="snippet-window">
          <div class="window-header">
            <!-- Mac window controls -->
            <div id="window-controls-mac" class="window-controls-mac">
              <div class="mac-dot mac-dot-close"></div>
              <div class="mac-dot mac-dot-minimize"></div>
              <div class="mac-dot mac-dot-maximize"></div>
            </div>
            <div id="window-controls-win" class="window-controls-win" style="display: none">
              <div class="win-btn win-btn-minimize" title="Minimize"></div>
              <div class="win-btn win-btn-maximize" title="Maximize"></div>
              <div class="win-btn win-btn-close" title="Close"></div>
            </div>
            <div
              id="window-title"
              class="window-title"
              contenteditable="true"
              spellcheck="false"
              title="Click to rename tab"
            >
              snippet.txt
            </div>
            <div class="header-spacer"></div>
          </div>
          <div id="snippet"></div>
          <div id="attribution-overlay" class="attribution-overlay">SnippetShot</div>
        </div>
      </div>
    </div>

    <template id="initial-snippet-template">
      <div class="snippet-initial">
        <div class="snippet-initial-icon">
          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <path d="M9 3v18M3 9h18"></path>
          </svg>
        </div>
        <div class="snippet-initial-title">Ready for a beautiful snippet?</div>
        <div class="snippet-initial-step">1. Copy some code from your editor</div>
        <div class="snippet-initial-step">2. Click here and paste (Ctrl+V or Cmd+V)</div>
        <div class="snippet-initial-step">3. Save as PNG or copy to clipboard below</div>
      </div>
    </template>

    <div id="floating-bar">
      <button id="quickBgBtn" class="btn btn-icon" title="Cycle Background Presets">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="10"></circle>
          <path
            d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"
          ></path>
          <path d="M2 12h20"></path>
        </svg>
      </button>

      <button id="lineNoBtn" class="btn btn-icon" title="Toggle Line Numbers">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="10" y1="6" x2="21" y2="6"></line>
          <line x1="10" y1="12" x2="21" y2="12"></line>
          <line x1="10" y1="18" x2="21" y2="18"></line>
          <path d="M3 6h1v4"></path>
          <path d="M4 10h-2"></path>
          <path d="M2 14h3v2.5a1.5 1.5 0 0 1-3 0v-.5"></path>
        </svg>
      </button>

      <div class="divider"></div>

      <!-- Copy to Clipboard -->
      <button id="copyBtn" class="btn btn-secondary" aria-label="Copy code snapshot to clipboard">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="copyBtnText">Copy</span>
      </button>

      <button id="saveBtn" class="btn btn-primary" aria-label="Save screenshot image">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
        <span id="saveBtnText">Save</span>
      </button>

      <div class="divider"></div>

      <button id="settingsBtn" class="btn btn-icon" title="Customize Mockup Options">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="4" y1="21" x2="4" y2="14"></line>
          <line x1="4" y1="10" x2="4" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12" y2="3"></line>
          <line x1="20" y1="21" x2="20" y2="16"></line>
          <line x1="20" y1="12" x2="20" y2="3"></line>
          <line x1="1" y1="14" x2="7" y2="14"></line>
          <line x1="9" y1="8" x2="15" y2="8"></line>
          <line x1="17" y1="16" x2="23" y2="16"></line>
        </svg>
      </button>
    </div>

    <div id="settings-popover">
      <div class="settings-section">
        <div class="settings-label">Canvas Background</div>
        <div class="presets-grid">
          <div
            class="preset-circle preset-sunset active"
            data-bg="sunset"
            title="Sunset Glow"
          ></div>
          <div class="preset-circle preset-ocean" data-bg="ocean" title="Deep Blue Ocean"></div>
          <div class="preset-circle preset-cyber" data-bg="cyber" title="Cyber Neon"></div>
          <div class="preset-circle preset-aurora" data-bg="aurora" title="Aurora Flare"></div>
          <div class="preset-circle preset-emerald" data-bg="emerald" title="Emerald Forest"></div>
          <div class="preset-circle preset-dark" data-bg="dark" title="Matte Obsidian"></div>
          <div class="preset-circle preset-candy" data-bg="candy" title="Cotton Candy"></div>
          <div class="preset-circle preset-royal" data-bg="royal" title="Royal Amethyst"></div>
          <div class="preset-circle preset-citrus" data-bg="citrus" title="Lime Citrus"></div>
          <div class="preset-circle preset-glass" data-bg="glass" title="Transparent Glass"></div>
        </div>
        <div class="color-picker-wrapper">
          <input type="color" id="bgPicker" value="#B0D7FF" title="Custom Solid Color Picker" />
          <span class="color-picker-hex" id="bgHex">#B0D7FF</span>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Canvas Padding</div>
        <div class="segmented-control" id="padding-controls">
          <button class="segment-btn" data-val="0px">None</button>
          <button class="segment-btn" data-val="16px 24px">S</button>
          <button class="segment-btn active" data-val="32px 40px">M</button>
          <button class="segment-btn" data-val="64px 80px">L</button>
          <button class="segment-btn" data-val="96px 120px">XL</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Window Controls</div>
        <div class="segmented-control" id="win-style-controls">
          <button class="segment-btn active" data-val="mac">macOS</button>
          <button class="segment-btn" data-val="win">Windows</button>
          <button class="segment-btn" data-val="none">None</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Drop Shadow</div>
        <div class="segmented-control" id="shadow-controls">
          <button class="segment-btn" data-val="none">None</button>
          <button class="segment-btn" data-val="soft">Soft</button>
          <button class="segment-btn active" data-val="medium">Medium</button>
          <button class="segment-btn" data-val="hard">Hard</button>
          <button class="segment-btn" data-val="glow">Glow</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Code Text Size</div>
        <div class="slider-group">
          <input type="range" id="fontSizeSlider" min="11" max="22" value="13" />
          <span class="slider-value" id="fontSizeValue">13px</span>
        </div>
      </div>

      <div class="settings-section">
        <div class="input-row">
          <div class="settings-label">Watermark / Attribution</div>
          <label class="switch">
            <input type="checkbox" id="attributionEnabled" />
            <span class="slider"></span>
          </label>
        </div>
        <input
          type="text"
          id="attributionText"
          class="text-input"
          placeholder="SnippetShot"
          style="width: 100%; display: none"
        />
      </div>

      <div class="settings-section">
        <div class="settings-label">Export Resolution</div>
        <div class="segmented-control" id="resolution-controls">
          <button class="segment-btn" data-val="1">1x Standard</button>
          <button class="segment-btn active" data-val="2">2x Retina</button>
          <button class="segment-btn" data-val="3">3x Ultra</button>
        </div>
      </div>
    </div>

    <script nonce="{{nonce}}" src="{{indexUri}}"></script>
  </body>
</html>
