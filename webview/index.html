<!doctype html>
<html>
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src https: data: vscode-webview-resource:; script-src 'nonce-{{nonce}}' vscode-webview-resource:; style-src 'unsafe-inline' https://fonts.googleapis.com vscode-webview-resource:; font-src https://fonts.gstatic.com;"
    />
    <link href="{{stylesUri}}" rel="stylesheet" />
  </head>
  <body>
    <div id="workspace">
      <div id="snippet-container" class="snippet-container">
        <div class="snippet-window">
          <div class="window-header">
            <div id="window-controls-mac" class="window-controls-mac" style="display: none">
              <div class="mac-dot mac-dot-close"></div>
              <div class="mac-dot mac-dot-minimize"></div>
              <div class="mac-dot mac-dot-maximize"></div>
            </div>
            <div id="window-title-container" class="window-title-container">
              <div id="breadcrumb-display" class="breadcrumb-display">
                <span class="path-segment">src</span>
                <span class="path-separator">&gt;</span>
                <span class="filename">index.js</span>
              </div>
            </div>
          </div>
          <div id="snippet"></div>
          <div
            id="bottom-status-container"
            class="bottom-status-container"
            title="Click to edit attribution"
          >
            <div id="bottom-status-tab" class="bottom-status-tab">Created with SnippetShot</div>
            <input
              type="text"
              id="bottom-status-input"
              class="bottom-status-input"
              style="display: none"
              spellcheck="false"
            />
          </div>
        </div>
      </div>
    </div>

    <template id="initial-snippet-template">
      <div class="snippet-initial">
        <div class="snippet-initial-title">Ready for a beautiful snippet?</div>
        <div class="snippet-initial-step">1. Copy some code from your editor</div>
        <div class="snippet-initial-step">2. Click here and paste (Ctrl+V or Cmd+V)</div>
        <div class="snippet-initial-step">3. Save as PNG or copy to clipboard below</div>
      </div>
    </template>

    <div id="floating-bar">
      <button id="quickBgBtn" class="btn btn-icon" title="Cycle Background Presets">
        <svg
          class="boop-palette"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="24"
          height="24"
          color="currentColor"
          fill="none"
        >
          <path
            d="M22 12C22 6.47715 17.5228 2 12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C12.8417 22 14 22.1163 14 21C14 20.391 13.6832 19.9212 13.3686 19.4544C12.9082 18.7715 12.4523 18.0953 13 17C13.6667 15.6667 14.7778 15.6667 16.4815 15.6667C17.3334 15.6667 18.3334 15.6667 19.5 15.5C21.601 15.1999 22 13.9084 22 12Z"
            stroke="currentColor"
            stroke-width="1.5"
          ></path>
          <circle cx="9.5" cy="8.5" r="1.5" stroke="currentColor" stroke-width="1.5"></circle>
          <circle cx="16.5" cy="9.5" r="1.5" stroke="currentColor" stroke-width="1.5"></circle>
          <path
            d="M7.125 15H7M7.25 15C7.25 15.1381 7.13807 15.25 7 15.25C6.86193 15.25 6.75 15.1381 6.75 15C6.75 14.8619 6.86193 14.75 7 14.75C7.13807 14.75 7.25 14.8619 7.25 15Z"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
      </button>

      <button id="lineNoBtn" class="btn btn-icon" title="Toggle Line Numbers">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="24"
          height="24"
          color="currentColor"
          fill="none"
        >
          <path
            d="M11 6L21 6"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          ></path>
          <path
            d="M11 12L21 12"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          ></path>
          <path
            d="M11 18L21 18"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
          ></path>
          <path
            class="boop-line"
            d="M3 15H4.5C4.77879 15 4.91819 15 5.03411 15.0231C5.51014 15.1177 5.88225 15.4899 5.97694 15.9659C6 16.0818 6 16.2212 6 16.5C6 16.7788 6 16.9182 5.97694 17.0341C5.88225 17.5101 5.51014 17.8823 5.03411 17.9769C4.91819 18 4.77879 18 4.5 18C4.22121 18 4.08181 18 3.96589 18.0231C3.48986 18.1177 3.11775 18.4899 3.02306 18.9659C3 19.0818 3 19.2212 3 19.5V20.4C3 20.6828 3 20.8243 3.08787 20.9121C3.17574 21 3.31716 21 3.6 21H6"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
          <path
            class="boop-line"
            d="M3 3H4.2C4.36569 3 4.5 3.13431 4.5 3.3V9M4.5 9H3M4.5 9H6"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
      </button>

      <div class="divider"></div>

      <button
        id="copyBtn"
        class="btn btn-secondary"
        title="Copy Snapshot (Ctrl+C / ⌘C)"
        aria-label="Copy code snapshot to clipboard"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="24"
          height="24"
          color="currentColor"
          fill="none"
        >
          <path
            class="boop-copy"
            d="M7 11V9C7 5.70017 7 4.05025 8.02513 3.02513C9.05025 2 10.7002 2 14 2C17.2998 2 18.9497 2 19.9749 3.02513C21 4.05025 21 5.70017 21 9V11C21 14.2998 21 15.9497 19.9749 16.9749C18.9497 18 17.2998 18 14 18C10.7002 18 9.05025 18 8.02513 16.9749C7 15.9497 7 14.2998 7 11Z"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
          <path
            d="M3 6V15C3 18.2998 3 19.9497 4.02513 20.9749C5.05025 22 6.70017 22 10 22H17"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
        <span id="copyBtnText">Copy</span>
      </button>

      <button
        id="saveBtn"
        class="btn btn-primary"
        title="Save Image (Ctrl+S / ⌘S)"
        aria-label="Save screenshot image"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="24"
          height="24"
          color="currentColor"
          fill="none"
        >
          <path
            d="M2.99969 17.0002C2.99969 17.9302 2.99969 18.3952 3.10192 18.7767C3.37932 19.8119 4.18796 20.6206 5.22324 20.898C5.60474 21.0002 6.06972 21.0002 6.99969 21.0002L16.9997 21.0002C17.9297 21.0002 18.3947 21.0002 18.7762 20.898C19.8114 20.6206 20.6201 19.8119 20.8975 18.7767C20.9997 18.3952 20.9997 17.9302 20.9997 17.0002"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
          <path
            class="boop-arrow"
            d="M16.4998 11.5002C16.4998 11.5002 13.1856 16.0002 11.9997 16.0002C10.8139 16.0002 7.49976 11.5002 7.49976 11.5002M11.9997 15.0002V3.00016"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
        <span id="saveBtnText">Save</span>
      </button>

      <div class="divider"></div>

      <button id="settingsBtn" class="btn btn-icon" title="Customize Mockup Options">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          width="24"
          height="24"
          color="currentColor"
          fill="none"
        >
          <path
            class="boop-gear"
            d="M12 11.5V12M18 12V11.5M6 11.5V12M12 5.49999V5.99999M18 5.49999V5.99999M6 5.49999V5.99999M12 17.5V18M18 17.5V18M6 17.5V18M12.5 11L11.5 11C11.2239 11 11 11.2239 11 11.5V12.5C11 12.7761 11.2239 13 11.5 13H12.5C12.7761 13 13 12.7761 13 12.5V11.5C13 11.2239 12.7761 11 12.5 11ZM18.5 11L17.5 11C17.2239 11 17 11.2239 17 11.5V12.5C17 12.7761 17.2239 13 17.5 13H18.5C18.7761 13 19 12.7761 19 12.5V11.5C19 11.2239 18.7761 11 18.5 11ZM6.50001 11L5.50001 11C5.22386 11 5 11.2239 5 11.5V12.5C5 12.7761 5.22386 13 5.5 13H6.5C6.77614 13 7 12.7761 7 12.5V11.5C7 11.2239 6.77615 11 6.50001 11ZM12.5 5.00001L11.5 5C11.2239 5 11 5.22386 11 5.5V6.49999C11 6.77614 11.2239 6.99999 11.5 6.99999H12.5C12.7761 6.99999 13 6.77614 13 6.49999V5.50001C13 5.22387 12.7761 5.00001 12.5 5.00001ZM18.5 5.00001L17.5 5C17.2239 5 17 5.22386 17 5.5V6.49999C17 6.77614 17.2239 6.99999 17.5 6.99999H18.5C18.7761 6.99999 19 6.77614 19 6.49999V5.50001C19 5.22387 18.7761 5.00001 18.5 5.00001ZM6.50001 5.00001L5.50001 5C5.22386 5 5 5.22386 5 5.5V6.49999C5 6.77614 5.22386 6.99999 5.5 6.99999H6.5C6.77614 6.99999 7 6.77614 7 6.49999V5.50001C7 5.22387 6.77615 5.00001 6.50001 5.00001ZM12.5 17L11.5 17C11.2239 17 11 17.2239 11 17.5V18.5C11 18.7761 11.2239 19 11.5 19H12.5C12.7761 19 13 18.7761 13 18.5V17.5C13 17.2239 12.7761 17 12.5 17ZM18.5 17L17.5 17C17.2239 17 17 17.2239 17 17.5V18.5C17 18.7761 17.2239 19 17.5 19H18.5C18.7761 19 19 18.7761 19 18.5V17.5C19 17.2239 18.7761 17 18.5 17ZM6.50001 17L5.50001 17C5.22386 17 5 17.2239 5 17.5V18.5C5 18.7761 5.22386 19 5.5 19H6.5C6.77614 19 7 18.7761 7 18.5V17.5C7 17.2239 6.77615 17 6.50001 17Z"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></path>
        </svg>
      </button>
    </div>

    <div id="settings-popover">
      <div class="settings-section">
        <div class="settings-label">Canvas Background</div>
        <div class="presets-grid">
          <div
            class="preset-circle preset-sunset active"
            data-bg="sunset"
            title="Sunset Glow"
          ></div>
          <div class="preset-circle preset-ocean" data-bg="ocean" title="Deep Blue Ocean"></div>
          <div class="preset-circle preset-cyber" data-bg="cyber" title="Cyber Neon"></div>
          <div class="preset-circle preset-aurora" data-bg="aurora" title="Aurora Flare"></div>
          <div class="preset-circle preset-emerald" data-bg="emerald" title="Emerald Forest"></div>
          <div class="preset-circle preset-dark" data-bg="dark" title="Matte Obsidian"></div>
          <div class="preset-circle preset-candy" data-bg="candy" title="Cotton Candy"></div>
          <div class="preset-circle preset-royal" data-bg="royal" title="Royal Amethyst"></div>
          <div class="preset-circle preset-citrus" data-bg="citrus" title="Lime Citrus"></div>
          <div class="preset-circle preset-glass" data-bg="glass" title="Transparent Glass"></div>
        </div>
        <div class="color-picker-wrapper">
          <input type="color" id="bgPicker" value="#B0D7FF" title="Custom Solid Color Picker" />
          <span class="color-picker-hex" id="bgHex">#B0D7FF</span>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Canvas Padding</div>
        <div class="segmented-control" id="padding-controls">
          <button class="segment-btn" data-val="0px">None</button>
          <button class="segment-btn" data-val="16px 24px">S</button>
          <button class="segment-btn active" data-val="32px 40px">M</button>
          <button class="segment-btn" data-val="64px 80px">L</button>
          <button class="segment-btn" data-val="96px 120px">XL</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Window Controls</div>
        <div class="segmented-control" id="win-style-controls">
          <button class="segment-btn" data-val="mac">macOS</button>
          <button class="segment-btn active" data-val="none">None</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Drop Shadow</div>
        <div class="segmented-control" id="shadow-controls">
          <button class="segment-btn" data-val="none">None</button>
          <button class="segment-btn" data-val="soft">Soft</button>
          <button class="segment-btn active" data-val="medium">Medium</button>
        </div>
      </div>

      <div class="settings-section">
        <div class="settings-label">Mockup Details</div>
        <div class="input-row">
          <span class="settings-label-sub" style="font-size: 11px; color: var(--text-muted)"
            >File Breadcrumbs</span
          >
          <label class="switch">
            <input type="checkbox" id="toggleBreadcrumbs" checked />
            <span class="slider"></span>
          </label>
        </div>
        <div class="input-row">
          <span class="settings-label-sub" style="font-size: 11px; color: var(--text-muted)"
            >Attribution Tab</span
          >
          <label class="switch">
            <input type="checkbox" id="attributionEnabled" checked />
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </div>

    <script nonce="{{nonce}}" src="{{indexUri}}"></script>
  </body>
</html>
