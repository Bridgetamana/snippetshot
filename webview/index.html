<html>
  <head>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src https: data: vscode-webview-resource:; script-src 'nonce-{{nonce}}' vscode-webview-resource:; style-src 'unsafe-inline' vscode-webview-resource:;"
    />
    <link href="{{stylesUri}}" rel="stylesheet" />
  </head>
  <body>
    <div class="toolbar">
      <label for="bgPicker" title="Background Color">
        Background
        <input type="color" id="bgPicker" value="#B0D7FF" />
      </label>
      <label for="lineNumbers" title="Show line numbers">
        Line numbers
        <input type="checkbox" id="lineNumbers" checked />
      </label>
      <label for="attributionEnabled">
        Attribution
        <input type="checkbox" id="attributionEnabled" />
        <input type="text" id="attributionText" placeholder="Enter attribution text" />
      </label>
      <label for="windowControls" title="Show window controls">
        Window controls
        <input type="checkbox" id="windowControls" checked />
      </label>
    </div>
    <div id="snippet-container" class="snippet-container">
      <div class="snippet-window">
        <div class="mac-traffic-lights">
          <div class="mac-traffic-light mac-traffic-light-close"></div>
          <div class="mac-traffic-light mac-traffic-light-minimize"></div>
          <div class="mac-traffic-light mac-traffic-light-maximize"></div>
        </div>
        <div id="snippet"></div>
        <div id="attribution-overlay" class="attribution-overlay"></div>
      </div>
    </div>

    <template id="initial-snippet-template">
      <meta charset="utf-8" />
      <div class="snippet-initial">
        <div class="snippet-initial-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <path d="M3 9h18M9 21V9"></path>
          </svg>
        </div>
        <div class="snippet-initial-title">Ready for a beautiful snippet?</div>
        <div class="snippet-initial-step">1. Copy some code from your editor</div>
        <div class="snippet-initial-step">2. Click here and paste (Ctrl+V)</div>
        <div class="snippet-initial-step">3. Save or Copy to clipboard</div>
      </div>
    </template>

    <div id="save-container">
      <button id="saveBtn" class="btn" aria-label="Save screenshot">
        <span id="saveBtnText">Save</span>
      </button>

      <button id="copyBtn" class="btn btn-copy" aria-label="Copy to clipboard">
        <span id="copyBtnText">Copy</span>
      </button>
    </div>

    <script nonce="{{nonce}}" src="{{indexUri}}"></script>
  </body>
</html>
